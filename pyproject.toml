[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buds-sidekick"
version = "1.0.2"
description = "A private, local voice assistant for Galaxy Buds FE on a Mac: listens, knows who is speaking, remembers, whispers help, translates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6",
  "numpy>=1.26",
  "sounddevice>=0.4",
  "faster-whisper>=1.0",
  "sherpa-onnx>=1.10",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
  "pywebview>=5; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
buds-sidekick = "buds_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["assistant", "lab"]
include = ["buds_assistant*", "budslab*"]
exclude = ["*tests*"]

[tool.setuptools.package-data]
buds_assistant = ["config/*.yaml", "dashboard/web/**/*", "dashboard/web_v1/**/*"]
budslab = ["web/**/*"]
